changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Internationalization & Documentation
      labels:
        - i18n
        - documentation
    - title: Other Changes
      labels:
        - "*"
