[package]
name = "earth"
version = "0.1.0"
edition = "2024"
description = "Earth — Cross-platform clipboard manager for macOS and Windows inspired by Maccy"
license = "MIT"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui_extras = { version = "0.37", features = ["image"] }
clipboard-rs = "0.3.5"
global-hotkey = "0.10"
tray-icon = "0.26"
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
nucleo-matcher = "0.3"
sha2 = "0.11"
base64 = "0.23"
urlencoding = "2.1"
auto-launch = "0.6"
active-win-pos-rs = "0.11"
rfd = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL", "NSData", "NSDictionary", "NSObjCRuntime", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
    "NSPasteboard",
    "NSEvent",
    "NSScreen",
    "NSWindow",
    "NSGraphics",
] }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
